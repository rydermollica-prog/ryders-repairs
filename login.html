<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Staff Login · Ryder's Repairs</title>
<style>
  :root { --indigo-0:#060912; --indigo-1:#0e1426; --bone:#ece6d6; --ecru:#d3c8aa; --rule:rgba(236,230,214,0.12); }
  html,body{margin:0;height:100%;background:var(--indigo-0);color:var(--ecru);font-family:'Spectral',Georgia,serif;}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;}
  .card{border:1px solid var(--rule);padding:40px;max-width:360px;width:100%;text-align:center;background:rgba(0,0,0,0.3);}
  h1{font-family:'Inter',system-ui,sans-serif;color:var(--bone);font-size:22px;margin:0 0 8px;}
  p{font-size:14px;line-height:1.6;margin:0 0 24px;}
  input{width:100%;background:rgba(0,0,0,0.35);border:1px solid var(--rule);color:var(--bone);
    font-family:'Spectral',serif;font-size:16px;padding:13px 14px;margin-bottom:14px;outline:none;}
  input:focus{border-color:var(--bone);}
  button{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;
    padding:14px 20px;border:1px solid var(--bone);background:var(--bone);color:var(--indigo-1);cursor:pointer;width:100%;}
  button:hover{background:transparent;color:var(--bone);}
  button:disabled{opacity:.5;cursor:default;}
  .msg{margin-top:16px;font-size:13px;min-height:18px;}
</style>
</head>
<body>
  <div class="wrap"><div class="card">
    <h1>Ryder's Repairs</h1>
    <p>Enter your email and we'll send you a sign-in link.</p>
    <form id="magic">
      <input id="email" type="email" placeholder="you@email.com" autocomplete="email" required />
      <button type="submit">Send me a sign-in link</button>
    </form>
    <div class="msg" id="msg"></div>
  </div></div>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const cfg = await (await fetch('/.netlify/functions/config')).json();
    const supabase = createClient(cfg.url, cfg.anonKey);
    const msg = document.getElementById('msg');

    // Already signed in? Go straight to the inbox.
    const { data: { session } } = await supabase.auth.getSession();
    if (session) location.replace('/inbox');

    const form = document.getElementById('magic');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) return;
      const btn = form.querySelector('button');
      btn.disabled = true;
      msg.style.color = ''; msg.textContent = 'Sending link...';
      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: location.origin + '/inbox' },
      });
      if (error) {
        msg.style.color = '#e08a8a'; msg.textContent = error.message; btn.disabled = false;
      } else {
        msg.style.color = ''; msg.textContent = 'Check your email for a sign-in link.';
      }
    });
  </script>
</body>
</html>
