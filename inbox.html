<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Quote Inbox · Ryder's Repairs</title>
<style>
  :root { --indigo-0:#060912; --indigo-1:#0e1426; --bone:#ece6d6; --ecru:#d3c8aa; --ecru-soft:#cdc2a2;
    --rule:rgba(236,230,214,0.12); --red:#b3242c; }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--indigo-0);color:var(--ecru);font-family:'Spectral',Georgia,serif;}
  header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--rule);}
  header h1{font-family:'Inter',system-ui,sans-serif;color:var(--bone);font-size:18px;margin:0;}
  header button{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    background:transparent;border:1px solid var(--rule);color:var(--ecru);padding:8px 14px;cursor:pointer;}
  .layout{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 57px);}
  .list{border-right:1px solid var(--rule);overflow:auto;}
  .row{padding:16px 20px;border-bottom:1px solid var(--rule);cursor:pointer;}
  .row:hover{background:rgba(255,255,255,0.03);}
  .row.active{background:rgba(255,255,255,0.06);}
  .row .name{font-family:'Inter',sans-serif;color:var(--bone);font-size:15px;}
  .row .sub{font-size:12px;color:var(--ecru-soft);margin-top:4px;}
  .badge{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    padding:2px 6px;border:1px solid var(--red);color:var(--red);margin-left:8px;}
  .detail{padding:28px 32px;overflow:auto;}
  .detail h2{font-family:'Inter',sans-serif;color:var(--bone);margin:0 0 4px;}
  .meta{font-size:13px;color:var(--ecru-soft);margin-bottom:20px;}
  .photos{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;}
  .photos img{width:120px;height:120px;object-fit:cover;border:1px solid var(--rule);}
  textarea{width:100%;min-height:140px;background:rgba(0,0,0,.3);border:1px solid var(--rule);color:var(--bone);
    font-family:'Spectral',serif;font-size:15px;padding:12px;}
  .send{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    background:var(--bone);border:1px solid var(--bone);color:var(--indigo-1);padding:12px 18px;cursor:pointer;margin-top:12px;}
  .send:disabled{opacity:.5;cursor:default;}
  .status{margin-left:14px;font-style:italic;}
  .empty{padding:40px;color:var(--ecru-soft);}
  .replied-note{margin-top:16px;padding:12px;border:1px solid var(--rule);font-size:14px;}
</style>
</head>
<body>
  <header>
    <h1>Quote Inbox</h1>
    <button id="signout">Sign out</button>
  </header>
  <div class="layout">
    <div class="list" id="list"><div class="empty">Loading...</div></div>
    <div class="detail" id="detail"><div class="empty">Select a quote.</div></div>
  </div>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const cfg = await (await fetch('/.netlify/functions/config')).json();
    const supabase = createClient(cfg.url, cfg.anonKey);

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { location.replace('/login'); }

    document.getElementById('signout').addEventListener('click', async () => {
      await supabase.auth.signOut(); location.replace('/login');
    });

    const listEl = document.getElementById('list');
    const detailEl = document.getElementById('detail');
    let quotes = [];

    function fmt(ts){ return new Date(ts).toLocaleString(); }
    function esc(s){ return String(s == null ? '' : s).replace(/</g, '&lt;'); }

    async function load() {
      const { data, error } = await supabase.from('quotes').select('*').order('created_at', { ascending: false });
      if (error) { listEl.innerHTML = '<div class="empty">Could not load (are you the right account?).</div>'; return; }
      quotes = data || [];
      if (!quotes.length) { listEl.innerHTML = '<div class="empty">No quotes yet.</div>'; return; }
      listEl.innerHTML = '';
      quotes.forEach((q) => {
        const row = document.createElement('div');
        row.className = 'row'; row.dataset.id = q.id;
        row.innerHTML = `<div class="name">${esc(q.name)}${q.status==='new'?'<span class="badge">New</span>':''}</div>
          <div class="sub">${esc(q.garment)} · ${fmt(q.created_at)}</div>`;
        row.addEventListener('click', () => showDetail(q.id));
        listEl.appendChild(row);
      });
    }

    async function signedUrls(paths) {
      const out = [];
      for (const p of (paths || [])) {
        const { data } = await supabase.storage.from('quote-photos').createSignedUrl(p, 300);
        if (data?.signedUrl) out.push(data.signedUrl);
      }
      return out;
    }

    async function showDetail(id) {
      document.querySelectorAll('.row').forEach((r) => r.classList.toggle('active', r.dataset.id === id));
      const q = quotes.find((x) => x.id === id);
      const urls = await signedUrls(q.photos);
      detailEl.innerHTML = `
        <h2>${esc(q.name)}</h2>
        <div class="meta">${esc(q.email)}${q.phone ? ' · ' + esc(q.phone) : ''} · ${esc(q.garment)} · ${fmt(q.created_at)}</div>
        <div>${esc(q.issue)}</div>
        <div class="photos">${urls.map((u)=>`<a href="${u}" target="_blank"><img src="${u}"></a>`).join('')}</div>
        ${q.status==='replied'
          ? `<div class="replied-note">Replied ${fmt(q.replied_at)}:<br><br>${esc(q.reply_body)}</div>`
          : `<textarea id="reply" placeholder="Type your quote reply to ${esc(q.name)}..."></textarea>
             <div><button class="send" id="send">Send reply</button><span class="status" id="sendStatus"></span></div>`}
      `;
      const sendBtn = document.getElementById('send');
      if (sendBtn) sendBtn.addEventListener('click', () => sendReply(id));
    }

    async function sendReply(id) {
      const btn = document.getElementById('send');
      const st = document.getElementById('sendStatus');
      const replyBody = document.getElementById('reply').value.trim();
      if (!replyBody) { st.textContent = 'Write a reply first.'; return; }
      btn.disabled = true; st.textContent = 'Sending...';
      try {
        const { data: { session } } = await supabase.auth.getSession();
        const res = await fetch('/.netlify/functions/send-reply', {
          method: 'POST',
          headers: { 'content-type': 'application/json', authorization: 'Bearer ' + session.access_token },
          body: JSON.stringify({ quoteId: id, replyBody }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Failed.');
        st.textContent = 'Sent.';
        await load(); await showDetail(id);
      } catch (e) {
        st.textContent = e.message; btn.disabled = false;
      }
    }

    await load();
  </script>
</body>
</html>
